name: Build JAAZ Catalogue APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Android project
        run: unzip -q JAAZ_Offline_Catalogue_Android_Source.zip

      - name: Build APK
        working-directory: JAAZOfflineCatalogue
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JAAZ-Offline-Catalogue-APK
          path: JAAZOfflineCatalogue/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
